name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load encrypted question bank
        run: npm run hydrate:protected

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /your-study-wiki

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Verify protected export
        run: |
          test -f out/protected/manifest.json
          test ! -d out/843
          test ! -f out/ustc843-bank.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
